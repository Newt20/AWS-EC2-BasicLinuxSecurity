# Place at /etc/ssh/sshd_config.d/99-hardening.conf
# Validate with: sudo sshd -t
# Apply with:    sudo systemctl restart ssh   (Amazon Linux: sshd)

# Disable direct root login - force login as a named user + sudo
PermitRootLogin no

# Key-based auth only - no password guessing
PasswordAuthentication no
PermitEmptyPasswords no
ChallengeResponseAuthentication no
KbdInteractiveAuthentication no

# Limit auth attempts per connection
MaxAuthTries 3
MaxSessions 4

# Drop idle/dead sessions
ClientAliveInterval 300
ClientAliveCountMax 2

# Reduce attack surface
X11Forwarding no
AllowTcpForwarding no
AllowAgentForwarding no

# Explicit allow-list of users permitted to log in over SSH
# Replace with ec2-user instead of ubuntu if using Amazon Linux
AllowUsers ubuntu
